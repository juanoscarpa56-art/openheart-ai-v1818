<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OpenHeart AI v18.18</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

background:#070b12;

color:white;

font-family:'Inter',sans-serif;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

}


.container{

text-align:center;

width:90%;

max-width:700px;

}


.logo{

font-size:58px;

font-weight:700;

letter-spacing:2px;

margin-bottom:12px;

}


.version{

color:#53b8ff;

font-size:18px;

margin-bottom:40px;

}


.subtitle{

font-size:20px;

opacity:.75;

margin-bottom:60px;

}


.status{

font-size:17px;

opacity:.85;

margin-top:35px;

line-height:1.8;

}


.progress{

width:100%;

height:10px;

background:#1a2331;

border-radius:50px;

overflow:hidden;

margin-top:20px;

}


.bar{

height:100%;

background:linear-gradient(90deg,#2aa8ff,#7fd0ff);

}


.initialBar{

width:0%;

animation:load 4s forwards;

}


@keyframes load{

from{

width:0%;

}

to{

width:100%;

}

}


.online{

margin-top:40px;

font-size:18px;

color:#74ff9f;

opacity:0;

animation:show 1s forwards;

animation-delay:4.2s;

}



.button{

margin-top:45px;

padding:18px 45px;

background:#1493ff;

border:none;

color:white;

font-size:18px;

border-radius:12px;

cursor:pointer;

opacity:0;

animation:show 1s forwards;

animation-delay:5s;

transition:.3s;

}


.button:hover{

transform:scale(1.05);

box-shadow:0 0 25px #1493ff;

}



.hidden{

display:none;

}



#analysis,
#memory{

animation:fadeIn 1s ease;

}



#analysisBar,
#memoryBar{

width:0%;

}



.dynamicButton{

margin-top:35px;

padding:15px 35px;

background:#53b8ff;

border:none;

color:white;

font-size:16px;

border-radius:12px;

cursor:pointer;

transition:.3s;

}


.dynamicButton:hover{

transform:scale(1.05);

box-shadow:0 0 20px #53b8ff;

}



.footer{

position:absolute;

bottom:18px;

right:20px;

color:#6aa7d8;

font-size:13px;

opacity:.5;

}



@keyframes show{

to{

opacity:1;

}

}



@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}


to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<!-- INICIO -->


<div id="home">


<div class="logo">

OpenHeart AI

</div>


<div class="version">

Version 18.18

</div>


<div class="subtitle">

Artificial Intelligence for Emotional Analysis

</div>


<div>

Initializing Emotional Core...

</div>


<div class="progress">

<div class="bar initialBar"></div>

</div>


<div class="online">

🟢 SYSTEM ONLINE

</div>


<button class="button" onclick="startAnalysis()">

INICIAR ANÁLISIS

</button>


</div>



<!-- ANALISIS -->


<div id="analysis" class="hidden">


<div class="logo">

OpenHeart AI

</div>


<div class="version">

EMOTIONAL ENGINE v1.8

</div>


<div class="status" id="analysisText">

Initializing analysis...

</div>


<div class="progress">

<div class="bar" id="analysisBar"></div>

</div>


</div>



<!-- MEMORY CORE -->


<div id="memory" class="hidden">


<div class="logo">

OpenHeart AI

</div>


<div class="version">

MEMORY CORE v1.0

</div>


<div class="status" id="memoryText">

Accessing encrypted memories...

</div>


<div class="progress">

<div class="bar" id="memoryBar"></div>

</div>


</div>


</div>


<div class="footer">

Build 18:18

</div>

<script>


function startAnalysis(){


document.getElementById("home").style.display="none";


document.getElementById("analysis").classList.remove("hidden");



let text=document.getElementById("analysisText");


let messages=[


"Initializing Emotional Engine...",


"Loading Memory System...",


"Analyzing connection patterns...",


"Generating personalized report..."



];


let i=0;



let interval=setInterval(()=>{


text.innerHTML=messages[i];


document.getElementById("analysisBar").style.width=((i+1)*25)+"%";



i++;



if(i>=messages.length){


clearInterval(interval);



setTimeout(()=>{


text.innerHTML=`

<div style="font-size:22px;color:#74ff9f;">

ANALYSIS COMPLETE

</div>


<br>


SUBJECT IDENTIFIED:

<br>


<span style="font-size:35px;color:#53b8ff;">

D.

</span>


<br><br>


STATUS:

<br>


Exceptionally Unique


<br><br>


<button class="dynamicButton" onclick="openMemory()">

ACCESS MEMORY CORE

</button>

`;



},1500);



}



},2000);



}





function openMemory(){


document.getElementById("analysis").style.display="none";


document.getElementById("memory").classList.remove("hidden");



let text=document.getElementById("memoryText");



let messages=[


"Accessing encrypted memories...",


"Searching emotional database...",


"Decrypting personal records...",


"4 memory files detected..."



];



let i=0;



let interval=setInterval(()=>{


text.innerHTML=messages[i];


document.getElementById("memoryBar").style.width=((i+1)*25)+"%";



i++;



if(i>=messages.length){


clearInterval(interval);



setTimeout(()=>{


text.innerHTML=`

<div style="font-size:20px;color:#74ff9f;">

MEMORY CORE ANALYSIS COMPLETE

</div>


<br><br>


RECOVERED FILES:


<br><br>


✓ 23_JULY_FIRST_CONNECTION.dat

<br>


✓ 26_JULY_SIGNAL_EVENT.log

<br>


✓ NACIONAL_MOMENT.archive

<br>


✓ 18_NOVEMBER_BEGINNING.connection


<br><br>


<button class="dynamicButton" onclick="finalReveal()">

OPEN FINAL REPORT

</button>

`;



},1500);



}



},2000);



}





function finalReveal(){


let memory=document.getElementById("memory");


memory.innerHTML=`

<div class="logo">

OpenHeart AI

</div>


<div class="version">

FINAL EMOTIONAL REPORT

</div>


<div class="status">


The system detected something unusual.


<br><br>


These are not just memories.

<br><br>


They are moments.


<br><br>


<span style="font-size:28px;color:#53b8ff;">

DAYANA

</span>


<br><br>


Connection Status:

<br>


<span style="color:#74ff9f;font-size:20px;">

IRREPLACEABLE

</span>


</div>

`;



}


</script>


</body>

</html>
