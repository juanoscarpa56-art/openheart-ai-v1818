<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OpenHeart AI v18.18</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#070b12;

color:white;

font-family:'Inter',sans-serif;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

}

.container{

text-align:center;

width:90%;

max-width:700px;

}

.logo{

font-size:58px;

font-weight:700;

letter-spacing:2px;

margin-bottom:12px;

}

.version{

color:#53b8ff;

font-size:18px;

margin-bottom:40px;

}

.subtitle{

font-size:20px;

opacity:.75;

margin-bottom:60px;

}

.status{

font-size:17px;

opacity:.8;

margin-top:35px;

}

.progress{

width:100%;

height:10px;

background:#1a2331;

border-radius:50px;

overflow:hidden;

margin-top:20px;

}

.bar{

width:0%;

height:100%;

background:linear-gradient(90deg,#2aa8ff,#7fd0ff);

animation:load 4s forwards;

}

@keyframes load{

0%{width:0%;}

100%{width:100%;}

}

.online{

margin-top:40px;

font-size:18px;

color:#74ff9f;

opacity:0;

animation:show 1s forwards;

animation-delay:4.2s;

}

.button{

margin-top:45px;

padding:18px 45px;

background:#1493ff;

border:none;

color:white;

font-size:18px;

border-radius:12px;

cursor:pointer;

opacity:0;

animation:show 1s forwards;

animation-delay:5s;

transition:.3s;

}

.button:hover{

transform:scale(1.05);

}

.footer{

position:absolute;

bottom:18px;

right:20px;

color:#6aa7d8;

font-size:13px;

opacity:.5;

}

@keyframes show{

to{

opacity:1;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

OpenHeart AI

</div>

<div class="version">

Version 18.18

</div>

<div class="subtitle">

Artificial Intelligence for Emotional Analysis

</div>

<div>

Initializing Emotional Core...

</div>

<div class="progress">

<div class="bar"></div>

</div>

<div class="online">

🟢 SYSTEM ONLINE

</div>

<button class="button">

INICIAR ANÁLISIS

</button>

</div>

<div class="footer">

Build 18:18

</div>

</body>

</html>
